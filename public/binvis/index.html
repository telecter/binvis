<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="A simple tool to visualize the binary number system.">
    <meta name="author" content="telecter">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="./main.css">
    <link rel="icon" href="./favicon.png">
    <script src="./main.js" defer></script>
    <title>binvis / visualize binary</title>
</head>

<body>
    <header class="container">
        <hgroup>
            <h1>binvis</h1>
            <h2>Visualize the binary number system.</h2>
        </hgroup>
    </header>
    <hr>
    <main class="container">
        <article class="text-center">
            <p id="binary-counter">00000000</p>
            <p class="text-secondary" id="decimal-counter">0</p>
            <p class="text-secondary" style="margin-top: 0; font-size: 1.5rem;">
                <span style="color: red" data-bit="128">128</span>
                +
                <span style="color: red" data-bit="64">64</span>
                +
                <span style="color: red" data-bit="32">32</span>
                +
                <span style="color: red" data-bit="16">16</span>
                +
                <span style="color: red" data-bit="8">8</span>
                +
                <span style="color: red" data-bit="4">4</span>
                +
                <span style="color: red" data-bit="2">2</span>
                +
                <span style="color: red" data-bit="1">1</span>
            </p>
            <small class="text-secondary"><i>Click each bit to flip it from 0 to 1 or vice versa.</i></small>
        </article>
        <article id="expl">
        </article>
    </main>
    <footer class="container-fluid">
        <small><a href="/">telecter.net</a> // <a href="https://github.com/telecter/binvis">github</a></small>
    </footer>
</body>

</html>
